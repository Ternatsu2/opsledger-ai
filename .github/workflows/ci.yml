name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.17
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          cd apps/api
          uv sync --frozen --all-groups

      - name: Static checks and unit/integration tests
        run: |
          npm run lint
          npm test
          npm run security:scan
          npm audit --audit-level=high

      - name: Production web build
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Critical browser flows
        run: npm run test:e2e

      - name: Live API contract
        run: |
          cd apps/api
          MODEL_PROVIDER=deterministic SEED_DEMO=true uv run uvicorn opsledger.main:app --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          cd ../..
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
