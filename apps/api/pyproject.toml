[project]
name = "opsledger-api"
version = "0.1.0"
description = "OpsLedger AI financing-readiness API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.39,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "orjson>=3.10,<4",
  "pandas>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opsledger"]
